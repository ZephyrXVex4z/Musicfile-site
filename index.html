<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NantiX · Música para descargar</title>
<meta name="description" content="Álbumes, sencillos y EP compartidos por la comunidad, con valoraciones y enlaces de descarga a servicios externos.">
<meta property="og:title" content="NantiX · Música para descargar">
<meta property="og:description" content="Descubre y comparte música. Valora de 1 a 5 estrellas.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://musicfile.site/">
<link rel="canonical" href="https://musicfile.site/">
<link rel="stylesheet" href="styles.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nx-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<a class="skip" href="#main">Saltar al contenido</a>
<header class="top">
  <button class="btn icon" id="menuBtn" type="button" aria-label="Menú" aria-expanded="false" aria-controls="side">☰</button>
  <a class="logo" href="#/home">Nanti<b>X</b></a>
  <form id="searchForm" role="search"><input id="q" type="search" aria-label="Buscar" placeholder="Buscar título, artista, género o etiqueta"></form>
  <div class="top-r">
    <span id="who" class="who"></span>
    <button class="btn primary" id="uploadBtn" type="button">Subir música</button>
    <button class="btn icon" id="themeBtn" type="button" aria-label="Cambiar tema">◐</button>
    <button class="btn" id="loginBtn" type="button">Entrar</button>
    <button class="btn" id="logoutBtn" type="button" hidden>Salir</button>
  </div>
</header>
<div class="layout">
  <nav id="side" class="side" aria-label="Menú"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<footer class="foot">
  <p>Este sitio solo organiza enlaces a archivos alojados en servicios externos y no aloja música. Cada persona es responsable de lo que publica y debe tener derecho a compartirlo.</p>
  <button class="btn link" id="reportGen" type="button">Reportar contenido o un enlace roto</button>
</footer>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
